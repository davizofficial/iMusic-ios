name: Build iMusic IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned .app
        run: |
          xcodebuild \
            -project iMusic.xcodeproj \
            -scheme iMusic \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify app bundle and Info.plist
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/iMusic.app"
          echo "=== Info.plist dump ==="
          plutil -p "$APP_PATH/Info.plist"
          EXEC=$(plutil -extract CFBundleExecutable raw "$APP_PATH/Info.plist" || true)
          echo "CFBundleExecutable is: $EXEC"
          if [ -z "$EXEC" ]; then
            echo "ERROR: CFBundleExecutable is missing from Info.plist!"
            exit 1
          fi
          if [ ! -f "$APP_PATH/$EXEC" ]; then
            echo "ERROR: Mach-O binary $APP_PATH/$EXEC does not exist!"
            exit 1
          fi
          echo "Mach-O binary info:"
          file "$APP_PATH/$EXEC"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/iMusic.app Payload/
          
          # Remove any CI _CodeSignature so TrollStore / AltStore / SideStore
          # can sign the binary cleanly with their respective certificates without conflicts.
          rm -rf Payload/iMusic.app/_CodeSignature
          
          # Package ONLY 1 single iMusic.ipa
          zip -qry iMusic.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: iMusic-ipa
          path: iMusic.ipa
          if-no-files-found: error
